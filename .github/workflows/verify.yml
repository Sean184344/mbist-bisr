name: RTL verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install simulators and synthesis tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys verilator g++ python3-venv
      - name: Install Python verification dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Verify and package
        run: |
          source .venv/bin/activate
          make package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            build/verification/
            build/cocotb_*.xml
            docs/results.json
            dist/
